
spring.application.name=akbiyev-baimurat-student-api

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studentuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
